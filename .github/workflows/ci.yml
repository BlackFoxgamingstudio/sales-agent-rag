name: CI — Sovereign Sales Agent RAG

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Lint
        run: |
          pip install ruff 2>/dev/null || true
          ruff check src/ tests/ 2>/dev/null || echo "Lint skipped (ruff not configured)"
        continue-on-error: true

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test
    if: hashFiles('Dockerfile') != ''
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --target runtime -t sovereign-sales-agent-rag:ci-test .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Bandit security check
        run: |
          pip install bandit 2>/dev/null || true
          bandit -r src/ -ll 2>/dev/null || echo "Security scan skipped"
        continue-on-error: true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/blackfoxgamingstudio/sales-agent-rag:latest
            ghcr.io/blackfoxgamingstudio/sales-agent-rag:${{ github.sha }}
